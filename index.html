      height: 100%;
      margin: 0;
    }

    .pin-yellow { filter: hue-rotate(225deg) saturate(4) brightness(1.25); }
    .pin-pink { filter: hue-rotate(135deg); }
    .pin-white { filter: grayscale(1) brightness(3) contrast(3); }

      { name: 'ユニバーサル・スタジオ・ジャパン', coordinates: [34.6654, 135.4323], color: '' },

      { name: 'サンリオピューロランド', coordinates: [35.6245, 139.4293], color: 'pin-white' }
    ];

    const map = L.map('map');

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    for (const location of locations) {
      const icon = L.icon({
        iconUrl: bluePin,
        iconSize: [40, 40],
        iconAnchor: [20, 40],
        popupAnchor: [0, -42],
        className: location.color
      });

      L.marker(location.coordinates, { icon }).addTo(map).bindPopup(location.name);
    }

    map.fitBounds(locations.map(location => location.coordinates), { padding: [40, 40] });
  </script>
